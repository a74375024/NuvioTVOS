name: Build

# Unsigned tvOS build. Pushes publish a pre-release; promote-preview.yml
# marks it latest.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish as the full (latest) release instead of a preview
        type: boolean
        default: false
      screens:
        description: Run the simulator screenshot tour
        type: boolean
        default: false
  push:
    branches: [multiview]
    paths-ignore: ['.github/approved-build']

permissions:
  contents: write

concurrency:
  group: build-multiview-ipa
  cancel-in-progress: true

jobs:
  build:
    # Same GitHub-hosted Xcode 27 image the upstream test workflow uses.
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history and tags, for the release notes.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version

      - name: Install pinned Tuist
        uses: jdx/mise-action@v2

      - name: Build unsigned IPA
        shell: bash
        run: |
          set +e
          bash scripts/build-ipa.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as one annotation (readable via the API).
            errors=$(grep -E "error:|fatal error|Undefined symbol" build.log | sed 's#^.*/Sources/##' | sort -u | head -80)
            [ -z "$errors" ] && errors=$(tail -60 build.log)
            encoded=$(printf '%s' "$errors" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::${encoded}"
          fi
          exit $status

      # Manual only: runs when dispatched with screens=true, never on push.
      - name: Screen tour (simulator screenshots)
        id: tour
        if: inputs.screens  # manual runs only (never on push)
        continue-on-error: true
        shell: bash
        run: bash scripts/screen-tour.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-multiview-ipa
          path: build-ipa/NuvioTV-unsigned.ipa
          if-no-files-found: error

      - name: Write release notes
        id: notes
        shell: bash
        run: |
          version=$(sed -n 's/^let marketingVersion = "\(.*\)"/\1/p' tvosApp/Project.swift)
          [ -z "$version" ] && version="dev"
          tag="enh-${version}-b${{ github.run_number }}"

          # Quiet notes: no feature list, no install instructions.
          echo "Build ${{ github.run_number }} · ${GITHUB_SHA::7}" > release-notes.md
          cat release-notes.md

          name="Build ${{ github.run_number }}"
          if [ "${{ inputs.release }}" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            name="${name} (preview)"
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ steps.notes.outputs.full != 'true' }}
          make_latest: ${{ steps.notes.outputs.full == 'true' }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: false
          files: |
            build-ipa/NuvioTV-unsigned.ipa

      - name: Tidy up old releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # Drops the old single rolling release and keeps the 5 newest builds.
        run: |
          gh release delete multiview-latest --cleanup-tag --yes -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | { grep '^enh-' || true; } | tail -n +6 \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true; done \
            || true

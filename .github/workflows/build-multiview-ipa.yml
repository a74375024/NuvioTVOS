name: Build Enhancements IPA

# Builds an unsigned tvOS .ipa from this fork so it can be sideloaded
# (Feather, Sideloadly, etc. re-sign it on install).
on:
  workflow_dispatch:
  push:
    branches: [multiview]

permissions:
  contents: write

concurrency:
  group: build-multiview-ipa
  cancel-in-progress: true

jobs:
  build:
    # Same GitHub-hosted Xcode 27 image the upstream test workflow uses.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history and tags, for the release notes.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version

      - name: Install pinned Tuist
        uses: jdx/mise-action@v2

      - name: Build unsigned IPA
        shell: bash
        run: |
          set +e
          bash scripts/build-ipa.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as one annotation (readable via the API).
            errors=$(grep -E "error:|fatal error|Undefined symbol" build.log | sed 's#^.*/Sources/##' | sort -u | head -80)
            [ -z "$errors" ] && errors=$(tail -60 build.log)
            encoded=$(printf '%s' "$errors" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::${encoded}"
          fi
          exit $status

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-multiview-ipa
          path: build-ipa/NuvioTV-unsigned.ipa
          if-no-files-found: error

      - name: Write release notes
        id: notes
        shell: bash
        run: |
          version=$(sed -n 's/^let marketingVersion = "\(.*\)"/\1/p' tvosApp/Project.swift)
          [ -z "$version" ] && version="dev"
          tag="enh-${version}-b${{ github.run_number }}"

          git remote add upstream https://github.com/bobsupra/NuvioTVOS.git 2>/dev/null || true
          git fetch --no-tags --quiet upstream main || true
          prev=$(git tag --list 'enh-*' --sort=-creatordate | head -1)
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
          else
            range="$(git merge-base HEAD upstream/main 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
          fi

          ours=$(git log "$range" --no-merges --author="a74375024" --format='%s' | { grep -v '^ci:' || true; } | sed 's/^/- /')
          upstream_count=$(git log "$range" --no-merges --format='%ae' | grep -v 'a74375024@users.noreply.github.com' | grep -vc 'github-actions' || true)

          {
            echo "## What's new in this build"
            if [ -n "$ours" ]; then echo "$ours"; else echo "- No changes to the enhancements."; fi
            echo
            echo "## From bobsupra"
            if [ "${upstream_count:-0}" -gt 0 ]; then
              echo "- ${upstream_count} new upstream commits (Nuvio ${version})."
            else
              echo "- No new upstream changes (Nuvio ${version})."
            fi
            echo
            echo "**Includes:** Multiview + Spotlight · Release Calendar · Shuffle · Auto-skip intros & endings"
            echo
            echo "Unsigned tvOS build of commit ${GITHUB_SHA::7}. Install with your sideloading tool; it re-signs the app on install."
            echo "Always-newest download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/NuvioTV-unsigned.ipa"
          } > release-notes.md
          cat release-notes.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=Nuvio ${version} + Enhancements · build ${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: build-ipa/NuvioTV-unsigned.ipa

      - name: Tidy up old releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # Drops the old single rolling release and keeps the 15 newest builds.
        run: |
          gh release delete multiview-latest --cleanup-tag --yes -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | { grep '^enh-' || true; } | tail -n +16 \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true; done \
            || true
